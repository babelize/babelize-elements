name: Release

# Publishing is triggered by publishing a GitHub Release, never by a push to main.
# The release tag is the source of truth for the version number.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, e.g. v1.1.0"
        required: true

permissions:
  contents: read
  # Required for npm provenance / trusted publishing.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      # Publishing is a single human click, so the full gate runs here against the
      # exact commit being released rather than trusting an earlier CI run.
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:lib
      - run: bun run test:pack

      - name: Set version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TAG="${RELEASE_TAG:-${GITHUB_REF#refs/tags/}}"
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '$TAG' is not a semver version; expected something like v1.1.0" >&2
            exit 1
          fi
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "package.json already at $VERSION, skipping bump"
          else
            echo "Setting package version to $VERSION from tag $TAG"
            npm version "$VERSION" --no-git-tag-version --ignore-scripts
          fi

      # npm trusted publishing (OIDC) needs npm >= 11.5.1; Node 20 ships an older one.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.6.2

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          # Fallback until trusted publishing is configured for @babelize/elements on
          # npmjs.com (Settings -> Trusted Publisher -> this repo + release.yml).
          # Once that is done, delete this env block and the NPM_TOKEN secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
