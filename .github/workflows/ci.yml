name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test

      # Builds the docs site and the published library. `build:lib` is the one
      # that catches packaging regressions before they reach npm.
      - run: bun run build
      - run: bun run build:lib

      # Installs the packed tarball into a bare project outside the repo, so
      # unresolvable specifiers in dist/ fail here instead of in a consumer's app.
      - run: bun run test:pack
