name: Bug Report
description: Report a bug in a Babelize Elements component
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: Which component is affected?
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Steps to reproduce the issue, ideally with a minimal code snippet.
      render: tsx
  - type: input
    id: environment
    attributes:
      label: Environment
      description: React version, Next.js/Vite version, browser, etc.
    validations:
      required: false
